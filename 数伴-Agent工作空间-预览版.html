<div id="toast" role="status" class="toast" hidden></div><script>
'use strict';
const $ = (s, root = document) => root.querySelector(s);
const $$ = (s, root = document) => [...root.querySelectorAll(s)];
const esc = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon = name => `<svg aria-hidden="true"><use href="#i-${name}"/></svg>`;
const state = {role:'student', filter:'all', thinking:false, context:'', favorites:['用图像理解导数的含义','极限与连续：两个概念的联系'], homework:[
 {id:1,title:'导数与微分 · 课后练习',chapter:'第二章',due:'本周五 23:59',question:'已知 f(x) = x³ − 3x，求函数的单调区间，并说明你判断的依据。',answer:'',submitted:false},
 {id:2,title:'极限与连续 · 思考题',chapter:'第一章',due:'本周日 23:59',question:'用自己的语言解释：函数在某点有极限，与函数在该点连续，有什么区别？',answer:'',submitted:false}
]};
const chapters=['函数与极限','导数与微分','微分中值定理与导数的应用','不定积分','定积分','定积分的应用','微分方程','向量代数与空间解析几何','多元函数微分法及其应用','重积分','曲线积分与曲面积分','无穷级数'];
const history=['用图像理解导数的含义','极限里的“无限接近”','帮我梳理积分方法'];
let toastTimer, photoUrl;
const toastEl=$('#toast');
toastEl.setAttribute('popover','manual');
function toast(message){clearTimeout(toastTimer);toastEl.textContent=message;toastEl.hidden=false;if(toastEl.showPopover)toastEl.showPopover();toastTimer=setTimeout(()=>{if(toastEl.hidePopover)toastEl.hidePopover();toastEl.hidden=true;},3000);}
function closeWindow(dialog){if(!dialog)return;dialog.close();dialog.remove();if(dialog.dataset.kind==='photo' && photoUrl){URL.revokeObjectURL(photoUrl);photoUrl=null;}}
function closeAll(){for(const d of $$('dialog.window').reverse())closeWindow(d);}
function createWindow(title,type,html,detail=false){
 const d=document.createElement('dialog');d.className='window'+(detail?' detail':'');d.dataset.kind=type;d.setAttribute('aria-label',title);
 d.innerHTML=`<header class="window-header"><div class="window-heading">${icon(({assignments:'work',courses:'book',favorites:'star',history:'clock',classes:'users',photo:'photo'})[type]||'grid')}<b>${esc(title)}</b><small>${detail?'详情窗口':'工作空间'}</small></div><div class="window-actions"><button class="icon-button" data-max aria-label="切换窗口大小">${icon('expand')}</button><button class="icon-button" data-close aria-label="关闭${esc(title)}">${icon('close')}</button></div></header><div class="window-body">${html}</div>`;
 document.body.append(d);d.showModal();
 $('[data-close]',d).onclick=()=>closeWindow(d);$('[data-max]',d).onclick=()=>d.classList.toggle('maximized');
 d.addEventListener('cancel',e=>{e.preventDefault();closeWindow(d);});
 d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeWindow(d);}});
 return d;
}
function assignmentCards(){let items=state.homework.filter(w=>state.filter==='all'||(state.filter==='done'?w.submitted:!w.submitted));return items.length?items.map(w=>`<button class="work-card" data-work="${w.id}"><span class="card-icon">${icon('work')}</span><span class="card-content"><h3>${esc(w.title)}</h3><p>高等数学 A · ${esc(w.chapter)}<br>${state.role==='teacher'?'示例教学班 · ':''}截止：${esc(w.due)}</p></span><span class="status ${w.submitted?'done':''}">${w.submitted?'已提交':state.role==='teacher'?'已发布':'待完成'}</span><span class="card-arrow">↗</span></button>`).join(''):'<div class="empty">这里暂时没有作业</div>';}
function refreshAssignments(){const d=$('dialog[data-kind="assignments"]');if(d){$('.assignment-list',d).innerHTML=assignmentCards();$$('[data-filter]',d).forEach(b=>b.classList.toggle('selected',b.dataset.filter===state.filter));}const n=state.homework.filter(w=>!w.submitted).length;$('#work-count').textContent=n;$('#suggest-work-caption').textContent=state.role==='teacher'?`${state.homework.length} 份示例作业 · 查看学习反馈`:`${n} 份待完成 · 随时开始`;}
function openAssignments(){state.filter='all';createWindow(state.role==='teacher'?'教学作业':'我的作业','assignments',`<p class="window-note">${state.role==='teacher'?'布置、查看与反馈，都在同一个窗口完成。':'做完这一步，再回到我们的对话。'} 以下为本页示例数据。</p><div class="window-toolbar"><div class="tabs"><button class="selected" data-filter="all">全部作业</button><button data-filter="todo">${state.role==='teacher'?'待提交':'待完成'}</button><button data-filter="done">已提交</button></div>${state.role==='teacher'?`<button class="primary" data-create>${icon('plus')}布置作业</button>`:'<span class="meta">高等数学 A · 示例教学班</span>'}</div><div class="assignment-list">${assignmentCards()}</div>`);}
function openWork(id){const w=state.homework.find(w=>w.id===Number(id));if(!w)return;
 const teacher=state.role==='teacher';const d=createWindow(w.title,'work-detail',`<h2 class="subheading">${esc(w.title)}</h2><div class="meta">高等数学 A · ${esc(w.chapter)} · 截止 ${esc(w.due)}</div><div class="question-box"><h4>本次练习 / 01</h4>${esc(w.question)}</div>${teacher?`<h3 class="subheading" style="font-size:15px">学生作答</h3>${w.submitted?`<div class="question-box">${esc(w.answer).replace(/\n/g,'<br>')}</div><form id="feedback-form"><label class="field">给学生的反馈<textarea name="feedback" required maxlength="1000" placeholder="写下建议与下一步思考方向…">${esc(w.feedback||'')}</textarea></label><div class="form-footer"><span class="meta">反馈仅保存在本次预览中</span><button class="primary">保存模拟反馈</button></div></form>`:'<div class="empty">林同学还未提交。可切换到学生视角体验提交。</div>'}`:`${w.feedback?`<div class="question-box"><h4>教师反馈</h4>${esc(w.feedback)}</div>`:''}<form id="answer-form"><label class="field">我的解题过程<textarea name="answer" required maxlength="3000" placeholder="写下思路与步骤，比只有答案更有意义…">${esc(w.answer)}</textarea></label><div class="form-footer"><button type="button" class="secondary" data-ask-work="${w.id}">${icon('spark')}与数伴讨论</button><button type="submit" class="primary">${w.submitted?'更新模拟作答':'模拟提交作业'} ↗</button></div><p class="window-note" style="margin:16px 0 0">这里只演示交互，不会提交到正式班级。</p></form>`}`,true);
 const form=$('#answer-form',d);if(form){$('textarea',form).addEventListener('input',e=>w.answer=e.target.value);form.onsubmit=e=>{e.preventDefault();w.answer=form.elements.answer.value.trim();if(!w.answer)return;w.submitted=true;refreshAssignments();closeWindow(d);toast('模拟提交成功，可切换教师视角查看与反馈');};}
 const feedback=$('#feedback-form',d);if(feedback)feedback.onsubmit=e=>{e.preventDefault();const value=feedback.elements.feedback.value.trim();if(!value)return;w.feedback=value;closeWindow(d);toast('模拟反馈已保存，学生视角可查看');};
}
function createAssignment(){const d=createWindow('布置新作业','create-work',`<p class="window-note">发布后可切换学生视角，体验接收和上交。</p><form id="create-form"><label class="field">作业名称<input name="title" required maxlength="80" placeholder="例如：导数的应用 · 巩固练习"></label><label class="field">教学班<select name="class"><option>高等数学 A · 示例教学班</option></select></label><label class="field">题目与要求<textarea name="question" required maxlength="2000" placeholder="输入题目，以及你希望学生展示的解题过程…"></textarea></label><label class="field">截止日期<input name="due" type="date" required></label><div class="form-footer"><span class="meta">只发布到本次预览的示例班级</span><button class="primary">模拟发布作业 ↗</button></div></form>`,true);const form=$('#create-form',d);form.onsubmit=e=>{e.preventDefault();const title=form.elements.title.value.trim(),question=form.elements.question.value.trim();if(!title||!question){toast('请填写作业名称和题目');return;}state.homework.unshift({id:Date.now(),title,question,due:form.elements.due.value+' 23:59',chapter:'综合练习',answer:'',submitted:false});state.filter='all';refreshAssignments();closeWindow(d);toast('模拟作业已发布，切换学生视角即可看到');};}
function openCourses(){createWindow('课程与知识','courses',`<p class="window-note">同济《高等数学》 · 12 章导航示意。选择章节，以知识点为起点继续对话。</p><div class="chapter-grid">${chapters.map((c,i)=>`<button class="chapter" data-chapter="${i}"><small>CHAPTER ${String(i+1).padStart(2,'0')}</small><b>${esc(c)}</b><span>查看章节 →</span></button>`).join('')}</div>`);}
function openChapter(index){const name=chapters[index];createWindow(name,'chapter',`<p class="window-note">第 ${Number(index)+1} 章 · 内容布局示例</p><h2 class="subheading">${esc(name)}</h2><div class="question-box"><h4>从哪里开始？</h4>先理解核心概念，再通过例题建立联系，最后用练习检验思路。此窗口展示章节交互结构，完整教材内容待接入。</div><div class="tool-grid"><button data-fill="请用直观的方式介绍「${esc(name)}」中的核心概念。" data-context="${esc(name)}">${icon('spark')}<span>概念讲解<small>用直观语言建立理解</small></span></button><button data-fill="请给我一道「${esc(name)}」的入门练习，先不要公布答案。" data-context="${esc(name)}">${icon('work')}<span>练一练<small>带着问题回到对话</small></span></button></div>`,true);}
function collectionHtml(items,favorites=false){return items.length?items.map((title,i)=>`<div class="collection-item"><button data-history-title="${esc(title)}">${esc(title)}<small>${favorites?'已收藏 · ':''}高等数学 · 示例记录</small></button>${favorites?`<button class="icon-button" data-remove-favorite="${esc(title)}" aria-label="取消收藏${esc(title)}">${icon('star')}</button>`:'<span class="meta">↗</span>'}</div>`).join(''):'<div class="empty">没有匹配的记录</div>';}
function openCollection(favorites){const type=favorites?'favorites':'history';const d=createWindow(favorites?'我的收藏':'对话记录',type,`<p class="window-note">把有启发的思路留下来，下次从这里继续。</p><input class="search" aria-label="搜索记录" placeholder="搜索${favorites?'收藏':'对话'}…"><div class="collection-list">${collectionHtml(favorites?state.favorites:history,favorites)}</div>`);$('.search',d).oninput=e=>$('.collection-list',d).innerHTML=collectionHtml((favorites?state.favorites:history).filter(t=>t.includes(e.target.value)),favorites);}
function openHistory(title){createWindow('回看对话','history-detail',`<h2 class="subheading">${esc(title)}</h2><p class="meta">示例对话 · 仅展示窗口体验</p><div class="question-box"><h4>你</h4>${esc(title)}</div><p class="meta">数伴 · 演示片段</p><p style="font-size:13px;line-height:1.9">我们可以从一个直观问题开始：当自变量发生微小变化时，函数值如何随之变化？把观察到的变化写下来，再逐步用数学语言表达。</p><div class="form-footer"><button class="secondary" data-save="${esc(title)}">${icon('star')}收藏这段思路</button><button class="primary" data-fill="继续讨论：${esc(title)}" data-context="历史话题">带入当前对话 ↗</button></div>`,true);}
function fillPrompt(text,context){const p=$('#prompt'),current=p.value.trim();const next=current?current+'\n\n'+text:text;if(next.length>2000){toast('合并后超过 2000 字，请先缩短当前草稿');return;}closeAll();p.value=next;state.context=context||'';updateComposer();p.focus();toast('已放入输入框，确认后再发送');}
function updateComposer(){$('.send').disabled=!$('#prompt').value.trim();const chip=$('#context-chip');chip.hidden=!state.context;if(state.context)chip.innerHTML=`${esc(state.context)}<button data-action="clear-context" aria-label="移除话题关联">×</button>`;}
function openPhoto(){const d=createWindow('拍照搜题','photo',`<p class="window-note">预览“导入图片 → 核对题干 → 带入对话”的流程。此版本不调用相机或识别服务。</p><div class="upload">${icon('photo')}<p>选择一张题目图片，保留在本机预览</p><input type="file" id="photo-file" accept="image/*" aria-label="选择题目图片"><img class="photo-preview" alt="所选题目图片" hidden></div><label class="field">核对题干<textarea id="photo-text" maxlength="2000" placeholder="此预览不自动识别，请输入题干，体验确认回填…"></textarea></label><div class="form-footer"><span class="meta">图片不会上传</span><button class="primary" id="confirm-photo">确认并带入对话 ↗</button></div>`,true);$('#photo-file',d).onchange=e=>{const file=e.target.files[0];if(!file)return;if(!file.type.startsWith('image/')){toast('请选择图片文件');return;}if(photoUrl)URL.revokeObjectURL(photoUrl);photoUrl=URL.createObjectURL(file);const img=$('img',d);img.src=photoUrl;img.hidden=false;};$('#confirm-photo',d).onclick=()=>{const text=$('#photo-text',d).value.trim();if(!text){toast('请先填写并核对题干');return;}fillPrompt(text,'图片题干');};}
function openClasses(){createWindow('班级管理','classes',`<p class="window-note">管理动作在窗口中完成，对话始终保留在身后。</p><button class="work-card" data-open="assignments"><span class="card-icon">${icon('users')}</span><span class="card-content"><h3>高等数学 A · 示例教学班</h3><p>1 位示例学生 · ${state.homework.length} 份作业</p></span><span class="card-arrow">查看作业 ↗</span></button><div class="collection-item"><span class="avatar">林</span><div class="card-content"><h3>林同学</h3><p>已完成 ${state.homework.filter(w=>w.submitted).length} / ${state.homework.length} 份示例作业</p></div><span class="status done">在班</span></div>`);}
function openSettings(){const d=createWindow('偏好设置','settings',`<p class="window-note">调整这个工作空间的外观。</p><div class="setting-row"><span>页面主题<small>让长时间思考更舒适</small></span><select id="theme" aria-label="页面主题"><option value="light">浅色</option><option value="dark" ${document.body.classList.contains('dark')?'selected':''}>深色</option></select></div><div class="setting-row"><span>预览数据<small>仅保留在当前页面，刷新后还原</small></span><span class="meta">本地示例</span></div><div class="setting-row"><span>窗口操作<small>Esc 关闭最上层窗口，返回上一步</small></span>${icon('expand')}</div>`,true);$('#theme',d).onchange=e=>document.body.classList.toggle('dark',e.target.value==='dark');}
function openTools(){createWindow('随手工具','tools',`<p class="window-note">需要的时候打开，完成后回到思考。</p><div class="tool-grid">${[['courses','book','课程与知识','按章节探索概念'],['assignments','work','作业','查看任务与反馈'],['photo','photo','拍照搜题','核对题干并带入'],['history','clock','对话记录','找回之前的思路'],['favorites','star','我的收藏','留下有用的解释'],['settings','grid','偏好设置','切换浅色与深色']].map(([key,i,t,s])=>`<button data-open="${key}">${icon(i)}<span>${t}<small>${s}</small></span></button>`).join('')}</div>`);}
const openers={assignments:openAssignments,courses:openCourses,history:()=>openCollection(false),favorites:()=>openCollection(true),photo:openPhoto,classes:openClasses,settings:openSettings,tools:openTools};
function open(name){const existing=$(`dialog[data-kind="${name}"]`);if(existing){while($$('dialog.window').at(-1)!==existing)closeWindow($$('dialog.window').at(-1));return;}openers[name]?.();if(innerWidth<=760)document.body.classList.add('side-collapsed');}
function setRole(role){state.role=role;document.body.dataset.role=role;$$('[data-role]').forEach(b=>b.classList.toggle('selected',b.dataset.role===role));$$('.teacher-only').forEach(el=>el.hidden=role!=='teacher');$('#profile-name').textContent=role==='teacher'?'陈老师':'林同学';$('.avatar').textContent=role==='teacher'?'陈':'林';$('#profile-caption').textContent=role==='teacher'?'高等数学 · 教学空间':'高等数学 · 学习空间';$('#work-label').textContent=role==='teacher'?'教学作业':'我的作业';$('#greeting').textContent=role==='teacher'?'让教学的每一步，都更从容。':'每一个问题，都是理解的开始。';$('#welcome-caption').textContent=role==='teacher'?'从备课灵感到学习反馈，数伴陪你连接每一次思考。':'一起拆解难题，连接知识，让思考再往前一步。';$('#suggest-work-title').textContent=role==='teacher'?'打开教学作业':'接着完成作业';refreshAssignments();toast(role==='teacher'?'已切换教师预览，可布置作业与查看提交':'已切换学生预览，可接收作业与查看反馈');}
function sendMessage(){const p=$('#prompt'),text=p.value.trim();if(!text)return;$('#welcome').hidden=true;$('#messages').hidden=false;const user=document.createElement('div');user.className='message user';user.innerHTML=`<p>${esc(text)}</p>`;$('#messages').append(user);const reply=document.createElement('div');reply.className='message assistant';const derivative=/导数|微分/.test(text);reply.innerHTML=`<div class="assistant-label"><span>✳</span>数伴<small>预设演示回复${state.thinking?' · 深入思考':''}</small></div><div class="reply-body">${derivative?'<p>我们先把“导数”看成一件直观的事：<b>某一瞬间，函数变化得有多快。</b></p><p>想象你正在观察一辆车的位置。两段时间之间的平均速度，对应曲线上的割线斜率；当时间间隔越来越小时，我们就在接近这一刻的速度。</p><div class="formula">f′(x) = lim<sub>h → 0</sub> [ f(x + h) − f(x) ] / h</div><p>以 f(x) = x² 为例，差商是 2x + h。当 h 趋近于 0 时，导数就是 2x。你想接着看图像，还是试一道小练习？</p>':'<p>我们可以按三个步骤展开：</p><p><b>01 · 整理已知</b><br>把题目给出的条件、要解决的问题分别写下来。</p><p><b>02 · 找到联系</b><br>回忆相关定义，判断哪些条件可以用上。</p><p><b>03 · 尝试与检查</b><br>先完成一小步，再核对结果是否符合原条件。</p><p class="meta">这是预设交互示例，不是针对当前问题生成的真实答案。</p>'}<div class="reply-actions"><button data-save="${esc(text.slice(0,60))}">☆ 收藏思路</button><button data-open="courses">打开相关课程 ↗</button></div></div>`;$('#messages').append(reply);p.value='';state.context='';updateComposer();$('#chat-scroll').scrollTop=$('#chat-scroll').scrollHeight;}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.open)open(b.dataset.open);
 if(b.dataset.role)setRole(b.dataset.role);
 if(b.hasAttribute('data-work'))openWork(b.dataset.work);
 if(b.hasAttribute('data-filter')){state.filter=b.dataset.filter;refreshAssignments();}
 if(b.hasAttribute('data-create'))createAssignment();
 if(b.hasAttribute('data-chapter'))openChapter(Number(b.dataset.chapter));
 if(b.hasAttribute('data-history'))openHistory(history[Number(b.dataset.history)]);
 if(b.hasAttribute('data-history-title'))openHistory(b.dataset.historyTitle);
 if(b.hasAttribute('data-fill'))fillPrompt(b.dataset.fill,b.dataset.context);
 if(b.hasAttribute('data-prompt'))fillPrompt(b.dataset.prompt,'推荐问题');
 if(b.hasAttribute('data-ask-work')){const w=state.homework.find(w=>w.id===Number(b.dataset.askWork));fillPrompt('请给我一些思路提示，不要直接给答案：\n'+w.question,w.title);}
 if(b.hasAttribute('data-save')){if(!state.favorites.includes(b.dataset.save))state.favorites.unshift(b.dataset.save);toast('已加入本次预览的收藏');}
 if(b.hasAttribute('data-remove-favorite')){state.favorites=state.favorites.filter(t=>t!==b.dataset.removeFavorite);const d=b.closest('dialog');$('.collection-list',d).innerHTML=collectionHtml(state.favorites.filter(t=>t.includes($('.search',d).value)),true);toast('已取消收藏');}
 if(b.classList.contains('side-toggle'))document.body.classList.toggle('side-collapsed');
 if(b.dataset.action==='new'){if($('#prompt').value.trim()||!$('#messages').hidden){const d=createWindow('开启新对话','new-chat',`<p class="window-note">当前预览对话和输入草稿将清空，作业与收藏会保留。</p><div class="form-footer"><button class="secondary" data-cancel-new>继续当前对话</button><button class="primary" data-confirm-new>开启新对话</button></div>`,true);$('[data-cancel-new]',d).onclick=()=>closeWindow(d);$('[data-confirm-new]',d).onclick=()=>{closeWindow(d);resetChat();};}else resetChat();}
 if(b.dataset.action==='home'){closeAll();$('#prompt').focus();if(innerWidth<=760)document.body.classList.add('side-collapsed');}
 if(b.dataset.action==='clear-context'){state.context='';updateComposer();}
});
function resetChat(){$('#messages').replaceChildren();$('#messages').hidden=true;$('#welcome').hidden=false;$('#prompt').value='';state.context='';updateComposer();if(innerWidth<=760)document.body.classList.add('side-collapsed');$('#prompt').focus();}
$('#chat-form').onsubmit=e=>{e.preventDefault();sendMessage();};$('#prompt').oninput=updateComposer;$('#prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendMessage();}};$('#think-toggle').onclick=()=>{state.thinking=!state.thinking;$('#think-toggle').setAttribute('aria-pressed',String(state.thinking));};
if(innerWidth<=760)document.body.classList.add('side-collapsed');
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('dialog[open]')&&innerWidth<=760)document.body.classList.add('side-collapsed');});

</script>
</body></html>
